[project]
name = "tgdl"
version = "0.1.0"
description = "Telegram bot that downloads media from links (YouTube, TikTok, Instagram, X, Twitch, Pinterest, ...) and sends it back as plain Telegram media"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.13",
    "yt-dlp>=2025.6.30",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "pydantic-settings>=2.4",
]

[project.scripts]
tgdl-bot = "tgdl.main:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tgdl"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "network: tests that hit real external services (deselect with '-m \"not network\"')",
]

[tool.ruff]
line-length = 100
target-version = "py312"
